name: Safe Fork Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check all upstream branches and tags without writing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: safefork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'schedule' || vars.SAFEFORK_PAUSED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SAFEFORK_PAT || github.token }}
      UPSTREAM_REPO: ${{ vars.SAFEFORK_UPSTREAM }}
      CONTROL_BRANCH: ${{ github.event.repository.default_branch }}
      PRIMARY_BRANCH: ${{ vars.SAFEFORK_PRIMARY_BRANCH || 'main' }}
      MIN_FILE_PERCENT: ${{ vars.SAFEFORK_MIN_FILE_PERCENT || '40' }}
      MIN_FILE_COUNT: ${{ vars.SAFEFORK_MIN_FILE_COUNT || '3' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Plan, validate, and synchronize safe Git refs
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Sync did not complete. The summary lists refs already written. Configure SAFEFORK_PAT if workflow permission is required."' ERR

          report() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          list_refs() {
            gh api "repos/$1/git/matching-refs/$2/" --paginate --jq '.[] | [.ref, .object.sha] | @tsv'
          }

          count_files() {
            gh api "repos/$1/git/trees/$2?recursive=1" --jq '
              if .truncated == false then
                [.tree[] | select(.type == "blob" or .type == "commit")] | length
              else error("The recursive tree is truncated.") end'
          }

          verify_ref() {
            local ref=$1 expected=$2 actual attempt
            for attempt in 1 2 3 4 5; do
              if actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" --jq '.object.sha' 2>/dev/null) &&
                 [ "$actual" = "$expected" ]; then
                return 0
              fi
              sleep "$attempt"
            done
            report "::error::$ref verification failed; expected $expected, got ${actual:-unavailable}."
            return 1
          }

          if [ -z "$UPSTREAM_REPO" ]; then
            report "::error::SAFEFORK_UPSTREAM is not configured."
            exit 1
          fi
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // empty')
          if [ "$parent" != "$UPSTREAM_REPO" ]; then
            report "::error::Fork parent differs from SAFEFORK_UPSTREAM; manual review required."
            exit 1
          fi

          upstream_heads_raw=$(list_refs "$UPSTREAM_REPO" heads)
          upstream_tags_raw=$(list_refs "$UPSTREAM_REPO" tags)
          fork_heads_raw=$(list_refs "$GITHUB_REPOSITORY" heads)
          fork_tags_raw=$(list_refs "$GITHUB_REPOSITORY" tags)

          declare -A upstream_heads fork_heads upstream_tags fork_tags
          declare -a create_branches=() update_branches=() create_tags=()

          while IFS=$'\t' read -r ref sha; do
            [ -n "$ref" ] || continue
            sha=${sha%$'\r'}
            upstream_heads["${ref#refs/heads/}"]=$sha
          done <<< "$upstream_heads_raw"
          while IFS=$'\t' read -r ref sha; do
            [ -n "$ref" ] || continue
            sha=${sha%$'\r'}
            upstream_tags["${ref#refs/tags/}"]=$sha
          done <<< "$upstream_tags_raw"
          while IFS=$'\t' read -r ref sha; do
            [ -n "$ref" ] || continue
            sha=${sha%$'\r'}
            fork_heads["${ref#refs/heads/}"]=$sha
          done <<< "$fork_heads_raw"
          while IFS=$'\t' read -r ref sha; do
            [ -n "$ref" ] || continue
            sha=${sha%$'\r'}
            fork_tags["${ref#refs/tags/}"]=$sha
          done <<< "$fork_tags_raw"

          if [ "${#upstream_heads[@]}" -eq 0 ]; then
            report "::error::No upstream branches were returned."
            exit 1
          fi
          if [ -n "${upstream_heads[$CONTROL_BRANCH]+present}" ]; then
            report "::error::Upstream contains reserved control branch $CONTROL_BRANCH."
            exit 1
          fi

          for branch in "${!upstream_heads[@]}"; do
            source_sha=${upstream_heads[$branch]}
            if [ -z "${fork_heads[$branch]+present}" ]; then
              create_branches+=("$branch")
              report "Plan: create branch $branch -> $source_sha"
              continue
            fi

            target_sha=${fork_heads[$branch]}
            [ "$target_sha" = "$source_sha" ] && continue
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$target_sha...$source_sha" --jq '.status')
            if [ "$relation" != "ahead" ]; then
              report "::error::Branch $branch is not a safe fast-forward ($relation); zero writes."
              exit 1
            fi

            if [ "$branch" = "$PRIMARY_BRANCH" ]; then
              current_count=$(count_files "$GITHUB_REPOSITORY" "$target_sha")
              upstream_count=$(count_files "$UPSTREAM_REPO" "$source_sha")
              report "Primary branch file count: Fork $current_count, upstream $upstream_count."
              if (( upstream_count < MIN_FILE_COUNT || upstream_count * 100 < current_count * MIN_FILE_PERCENT )); then
                report "::error::Upstream primary branch file count dropped beyond the configured gate."
                exit 1
              fi
            fi

            update_branches+=("$branch")
            report "Plan: fast-forward branch $branch, $target_sha -> $source_sha"
          done

          for tag in "${!upstream_tags[@]}"; do
            source_sha=${upstream_tags[$tag]}
            if [ -z "${fork_tags[$tag]+present}" ]; then
              create_tags+=("$tag")
              report "Plan: copy immutable tag $tag -> $source_sha"
            elif [ "${fork_tags[$tag]}" != "$source_sha" ]; then
              report "::error::Tag $tag has the same name but a different SHA; tags are immutable."
              exit 1
            fi
          done

          report "Plan: ${#create_branches[@]} new branches, ${#update_branches[@]} fast-forwards, ${#create_tags[@]} new tags."
          if [ "$DRY_RUN" = "true" ]; then
            report "Dry-run complete: zero writes."
            exit 0
          fi

          latest_upstream_heads=$(list_refs "$UPSTREAM_REPO" heads)
          latest_upstream_tags=$(list_refs "$UPSTREAM_REPO" tags)
          if [ "$(printf '%s\n' "$latest_upstream_heads" | LC_ALL=C sort)" != "$(printf '%s\n' "$upstream_heads_raw" | LC_ALL=C sort)" ] ||
             [ "$(printf '%s\n' "$latest_upstream_tags" | LC_ALL=C sort)" != "$(printf '%s\n' "$upstream_tags_raw" | LC_ALL=C sort)" ]; then
            report "::error::Upstream refs changed during planning; run again."
            exit 1
          fi

          writes=0
          for branch in "${update_branches[@]}"; do
            expected_before=${fork_heads[$branch]}
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
            if [ "$latest" != "$expected_before" ]; then
              report "::error::Target branch $branch changed during planning."
              exit 1
            fi
            source_sha=${upstream_heads[$branch]}
            updated=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" -f sha="$source_sha" -F force=false --jq '.object.sha')
            writes=$((writes + 1))
            [ "$updated" = "$source_sha" ] && verify_ref "heads/$branch" "$source_sha"
            report "Fast-forwarded branch: $branch -> $source_sha"
          done

          for branch in "${create_branches[@]}"; do
            source_sha=${upstream_heads[$branch]}
            created=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$source_sha" --jq '.object.sha')
            writes=$((writes + 1))
            [ "$created" = "$source_sha" ] && verify_ref "heads/$branch" "$source_sha"
            report "Created branch: $branch -> $source_sha"
          done

          for tag in "${create_tags[@]}"; do
            source_sha=${upstream_tags[$tag]}
            created=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$source_sha" --jq '.object.sha')
            writes=$((writes + 1))
            [ "$created" = "$source_sha" ] && verify_ref "tags/$tag" "$source_sha"
            report "Copied tag: $tag -> $source_sha"
          done

          report "Sync complete: wrote $writes refs; no merge, force update, or delete."
